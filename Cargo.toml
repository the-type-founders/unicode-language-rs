[package]
name = "unicode-language"
version = "2.2.0"
edition = "2021"
build = "build.rs"
license = "Apache-2.0"
keywords = ["unicode", "language"]
description = "A library to detect language coverage given a list of codepoints."
authors = ["Bram Stein <b.l.stein@gmail.com>"]
repository = "https://github.com/the-type-founders/unicode-language-rs/"

[lib]
name = "unicode_language"
path = "src/lib.rs"

[build-dependencies]
glob = "0.3"
serde = { version = "1", features = ["derive"] }
# Keep this exact: serde_yml is deprecated, and 0.0.x parser behavior has
# already changed in a way that breaks the build script's Ruby YAML input.
serde_yml = "=0.0.13"
langtag = "1"
